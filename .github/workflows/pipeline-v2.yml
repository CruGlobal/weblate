# Build once, promote the artifact.
#
# One environment-agnostic image is built from `main` and deployed to the
# release-candidate environment. Production later runs that exact image, pinned
# by digest — a promote re-points production at an image that already exists, it
# never rebuilds.
#
# Nothing builds on push, deliberately. The scheduled run builds the tip of
# `main` once a day and reuses the existing candidate when `main` has not moved;
# `workflow_dispatch` does the same on demand, which is also the hotfix path.
# The nightly slot is 05:00 UTC (midnight EST / 1am EDT), off-peak on GitHub's
# scheduler. Scheduled dispatch is best-effort, so a run that starts a few
# minutes late is expected, not a failure.
#
# Every `uses:` ref below and the `workflow-ref` input must name the SAME ref
# (`v2`) — change them together or not at all, or one ref's workflow runs
# against another ref's actions.
name: Pipeline v2

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

jobs:
  build:
    name: Build candidate
    uses: CruGlobal/.github/.github/workflows/build-candidate.yml@v2
    # The build authenticates to AWS via OIDC, so the caller must grant
    # id-token: write — a reusable workflow can only downgrade, never elevate,
    # the caller's permissions.
    permissions:
      id-token: write
      contents: read
    with:
      workflow-ref: v2
      type: ecs
    # Build-time secrets are repo secrets named BUILD_<NAME>; `inherit` hands
    # them over and the reusable workflow exports only those keys into the build
    # environment, prefix stripped.
    secrets: inherit

  deploy-release-candidate:
    name: Deploy to release-candidate
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: CruGlobal/.github/actions/dispatch@v2
        with:
          github-token: ${{ secrets.CRU_DEPLOY_GITHUB_TOKEN }}
          workflow: deploy-candidate.yml
          inputs-json: >-
            {"project-name": "${{ needs.build.outputs.project-name }}",
             "tag": "${{ needs.build.outputs.candidate }}"}
