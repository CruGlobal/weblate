name: Conventional Commits

# Validates that the PR title is a valid Conventional Commit. It matters here
# because the repo squash-merges and the PR title becomes the commit subject on
# `main`, which is what makes a release's diff legible.
#
# Scope is optional (`fix:` and `fix(docker):` both pass). The list below is the
# fleet default, unmodified. Dependabot's `deps` and `ci` prefixes from
# .github/dependabot.yml are both on it; a title outside the list fails the
# check and cannot be merged, so any new Dependabot prefix has to be added here
# in the same change.
#
# The job name — "Validate PR Title" — is the required status check the branch
# ruleset expects. Renaming the job silently drops that gate.
#
# Deliberately carries no branch filter, so it reports on every pull request
# regardless of base branch.
on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: read

jobs:
  semantic-pr:
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            ci
            docs
            build
            deps
            perf
            refactor
            revert
            style
            test
